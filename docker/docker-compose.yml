version: "3.8"
services:
  mariadb:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pdns
      MYSQL_USER: pdns
      MYSQL_PASSWORD: securepassword
    volumes:
      - mariadb_data:/var/lib/mysql

  powerdns:
    image: powerdns/pdns:latest
    environment:
      PDNS_gmysql_host: mariadb
      PDNS_gmysql_user: pdns
      PDNS_gmysql_password: securepassword
      PDNS_gmysql_dbname: pdns
    depends_on:
      - mariadb
    ports:
      - "53:53/udp"
      - "53:53"

volumes:
  mariadb_data:
