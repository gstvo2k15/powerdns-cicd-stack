- name: Deploy PowerDNS and configure VM
  hosts: pdns_vm
  become: true
  tasks:
    # Step 1: Configure Spanish Keyboard
    - name: Install console-data package for keyboard config
      apt:
        name: console-data
        state: present

    - name: Configure keyboard to Spanish
      command: setupcon --force
      environment:
        LANG: es_ES.UTF-8

    # Step 2: Configure Static IP Address
    - name: Configure static IP address
      copy:
        dest: /etc/netplan/01-netcfg.yaml
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens33:  # Replace with the correct interface name
                addresses:
                  - 192.168.1.151/24
                gateway4: 192.168.1.1
                nameservers:
                  addresses:
                    - 8.8.8.8
                    - 8.8.4.4
      notify: Apply Network Configuration

    - name: Apply Network Configuration
      command: netplan apply
      when: ansible_network_interfaces['ens33']['state'] == 'up'

    # Step 3: Install MariaDB
    - name: Install MariaDB
      apt:
        name: mariadb-server
        state: present

    # Step 4: Install PowerDNS
    - name: Install PowerDNS and MySQL Backend
      apt:
        name:
          - pdns-server
          - pdns-backend-mysql
        state: present

    # Step 5: Configure PowerDNS
    - name: Configure PowerDNS with MariaDB Backend
      copy:
        dest: /etc/powerdns/pdns.conf
        content: |
          launch=gmysql
          gmysql-host=localhost
          gmysql-user=pdns
          gmysql-password=securepassword
          gmysql-dbname=pdns
      notify: Restart PowerDNS

    - name: Create MariaDB database for PowerDNS
      mysql_db:
        name: pdns
        state: present

    - name: Create MariaDB user for PowerDNS
      mysql_user:
        name: pdns
        password: securepassword
        priv: "pdns.*:ALL"
        state: present

  handlers:
    - name: Restart PowerDNS
      service:
        name: pdns
        state: restarted
