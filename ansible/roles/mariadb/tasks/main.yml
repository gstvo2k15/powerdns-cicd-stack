- name: Install MariaDB and dependencies
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
    state: present
    update_cache: yes

- name: Stop MariaDB service
  ansible.builtin.systemd:
    name: mariadb
    state: stopped

- name: Force stop MariaDB using mysqladmin
  ansible.builtin.shell: |
    mysqladmin -u root shutdown || true
  args:
    executable: /bin/bash
  ignore_errors: yes

- name: Check if any MariaDB processes are still running
  ansible.builtin.shell: |
    pgrep -f mysqld || true
  register: mariadb_process_check
  changed_when: false

- name: Kill remaining MariaDB processes if found
  ansible.builtin.shell: |
    kill -9 $(pgrep -f mysqld) || true
  when: mariadb_process_check.stdout != ""
  args:
    executable: /bin/bash
  ignore_errors: yes

- name: Ensure MariaDB is not running
  ansible.builtin.shell: |
    pgrep -f mysqld || true
  register: final_process_check
  failed_when: final_process_check.stdout != ""
  changed_when: false

- name: Create reset_root_password.sh script
  ansible.builtin.copy:
    dest: /usr/local/bin/reset_root_password.sh
    content: |
      #!/bin/bash
      mysqld_safe --skip-grant-tables --skip-networking &
      sleep 5
      mysql -u root <<EOF
      FLUSH PRIVILEGES;
      ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mariadb_root_password }}';
      EOF
      mysqladmin shutdown
    mode: '0755'

- name: Execute reset_root_password.sh script
  ansible.builtin.command:
    cmd: /usr/local/bin/reset_root_password.sh
  ignore_errors: yes

- name: Remove reset_root_password.sh script
  ansible.builtin.file:
    path: /usr/local/bin/reset_root_password.sh
    state: absent

- name: Start MariaDB in normal mode
  ansible.builtin.systemd:
    name: mariadb
    state: started
