- name: "Install MariaDB and dependencies"
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
    state: present
    update_cache: yes

- name: "Start and enable MariaDB service"
  ansible.builtin.systemd:
    name: mariadb
    enabled: true
    state: started

- name: "Set mysql_root_passwd"
  community.mysql.mysql_user:
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    user: root
    check_implicit_admin: true
    password: "{{ mariadb_root_password }}"
    host: localhost

- name: "Remove remote root"
  community.mysql.mysql_user:
    check_implicit_admin: true
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    user: root
    host: "{{ ansible_fqdn }}"
    state: absent

- name: Create PowerDNS database
  community.mysql.mysql_db:
    name: pdns
    state: present
    login_user: root
    login_password: "{{ mariadb_root_password }}"

- name: "Grant privileges to PowerDNS user"
  community.mysql.mysql_user:
    name: pdnsadmin
    host: localhost
    password: "{{ pdns_user_password }}"
    priv: "pdns.*:ALL"
    state: present
    login_user: root
    login_password: "{{ mariadb_root_password }}"

- name: "Flush privileges"
  ansible.builtin.command:
    cmd: >
      mysql -u root -p{{ mariadb_root_password }} -e "FLUSH PRIVILEGES;"

- name: Enable and ensure MariaDB service is active
  ansible.builtin.systemd:
    name: mariadb
    enabled: true
    state: started