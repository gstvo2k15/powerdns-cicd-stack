- name: Install MariaDB and dependencies
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
    state: present
    update_cache: yes

- name: Stop MariaDB service
  ansible.builtin.systemd:
    name: mariadb
    state: stopped

- name: Check if MariaDB processes are running
  ansible.builtin.shell: |
    pgrep -f mysqld_safe || pgrep -f mysqld
  register: mariadb_process_check
  failed_when: false
  changed_when: false

- name: Kill MariaDB processes if running
  ansible.builtin.shell: |
    pkill -f mysqld_safe || true
    pkill -f mysqld || true
  when: mariadb_process_check.stdout != ""
  args:
    executable: /bin/bash
  ignore_errors: true

- name: Force kill MariaDB if still running
  ansible.builtin.shell: |
    kill -9 $(pgrep -f mysqld_safe || pgrep -f mysqld) || true
  when: mariadb_process_check.stdout != ""
  args:
    executable: /bin/bash
  ignore_errors: true

- name: Ensure MariaDB is not running
  ansible.builtin.shell: |
    pgrep -f mysqld_safe || pgrep -f mysqld
  register: check_mariadb
  failed_when: check_mariadb.stdout != ""
  changed_when: false

- name: Create reset_root_password.sh script
  ansible.builtin.copy:
    dest: /usr/local/bin/reset_root_password.sh
    content: |
      #!/bin/bash
      mysqld_safe --skip-grant-tables --skip-networking &
      sleep 5
      mysql -u root <<EOF
      FLUSH PRIVILEGES;
      ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mariadb_root_password }}';
      EOF
      mysqladmin shutdown
    mode: '0755'

- name: Execute reset_root_password.sh script
  ansible.builtin.command:
    cmd: /usr/local/bin/reset_root_password.sh
  ignore_errors: yes

- name: Remove reset_root_password.sh script
  ansible.builtin.file:
    path: /usr/local/bin/reset_root_password.sh
    state: absent

- name: Start MariaDB in normal mode
  ansible.builtin.systemd:
    name: mariadb
    state: started
