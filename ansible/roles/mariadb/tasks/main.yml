- name: Stop MariaDB service
  ansible.builtin.systemd:
    name: mariadb
    state: stopped

- name: Kill remaining MariaDB processes if any
  ansible.builtin.shell: |
    pkill -9 -f mysqld || true
  args:
    executable: /bin/bash
  ignore_errors: true

- name: Ensure MariaDB processes are not running
  ansible.builtin.shell: |
    pgrep -f mysqld || true
  register: mariadb_process_check
  changed_when: false
  failed_when: mariadb_process_check.stdout != ""

- name: Clean MariaDB control files
  ansible.builtin.shell: |
    rm -f /var/lib/mysql/aria_log_control
    rm -f /var/lib/mysql/ibtmp1
  args:
    executable: /bin/bash
  become: true
  ignore_errors: true

- name: Start MariaDB service
  ansible.builtin.systemd:
    name: mariadb
    state: started

- name: Check MariaDB status
  ansible.builtin.systemd:
    name: mariadb
    failed_when: false
    register: mariadb_status

- name: Debug MariaDB status
  ansible.builtin.debug:
    var: mariadb_status
