- name: Install MariaDB
  apt:
    name: mariadb-server
    state: present

- name: Configure MariaDB
  template:
    src: templates/mariadb.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/50-server.cnf
  notify: Restart MariaDB

- name: Create PowerDNS database and user
  mysql_db:
    name: pdns
    state: present

- name: Grant privileges to PowerDNS user
  mysql_user:
    name: pdns
    password: securepassword
    priv: "pdns.*:ALL"
    state: present

- name: Restart MariaDB
  service:
    name: mariadb
    state: restarted
