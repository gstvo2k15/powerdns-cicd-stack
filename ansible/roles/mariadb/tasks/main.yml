- name: Install MariaDB and dependencies
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
    state: present
    update_cache: yes

- name: Configure MariaDB to use password authentication for root
  ansible.builtin.command:
    cmd: >
      mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '{{ mariadb_root_password }}'; FLUSH PRIVILEGES;"
  args:
    warn: false

- name: Create Ansible user with privileges
  community.mysql.mysql_user:
    name: ansible
    host: localhost
    password: "{{ ansible_db_password }}"
    priv: "*.*:ALL,GRANT"
    state: present

- name: "Configure MariaDB"
  ansible.builtin.template:
    src: "templates/mariadb.cnf.j2"
    dest: "/etc/mysql/mariadb.conf.d/50-server.cnf"
    mode: '0644'
  notify: "Restart MariaDB"

- name: "Create PowerDNS database and user"
  community.mysql.mysql_db:
    name: pdns
    state: present

- name: "Grant privileges to PowerDNS user"
  community.mysql.mysql_user:
    name: pdns
    password: securepassword
    priv: "pdns.*:ALL"
    state: present
